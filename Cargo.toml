[package]
name = "tau"
version = "0.1.0"
edition = "2024"

[dependencies]
mtp = { git = "https://git.methanium.net/methanium/mtp", rev = "ad489265deacadd6de52ed2129d071803a0e7247", features = ["host", "crypto"] }
dashmap = "6.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mtp = { git = "https://git.methanium.net/methanium/mtp", rev = "ad489265deacadd6de52ed2129d071803a0e7247", features = ["web-server", "client"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rcgen = "0.14"
