[package]
name = "tau"
version = "0.1.0"
edition = "2024"

[dependencies]
tau-relay-protocol = { path = "relay-protocol" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "db3125809293e462ec1593704e9c4d2172437533", features = ["host", "crypto"] }
dashmap = "6.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "db3125809293e462ec1593704e9c4d2172437533", features = ["web-server", "client"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rcgen = "0.14"
