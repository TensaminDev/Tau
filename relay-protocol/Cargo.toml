[package]
name = "tau-relay-protocol"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:mtp-crypto", "dep:getrandom"]

[dependencies]
mtp = { git = "https://git.methanium.net/methanium/mtp", rev = "ad489265deacadd6de52ed2129d071803a0e7247", default-features = false, features = ["crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
mtp-crypto = { git = "https://git.methanium.net/methanium/mtp", rev = "ad489265deacadd6de52ed2129d071803a0e7247", features = ["wasm"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
