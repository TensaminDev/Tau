[package]
name = "tau-relay-protocol"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:mtp-crypto", "dep:getrandom"]

[dependencies]
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "9f7f94e4cbd227610784ae47a1e7a1acf66f8584", default-features = false, features = ["crypto"] }
mtp-type-map = { git = "https://github.com/Nonanium/MTP.git", rev = "9f7f94e4cbd227610784ae47a1e7a1acf66f8584", features = ["registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
mtp-crypto = { git = "https://github.com/Nonanium/MTP.git", rev = "9f7f94e4cbd227610784ae47a1e7a1acf66f8584", features = ["wasm"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[patch."https://github.com/Nonanium/MTP.git"]
mtp = { path = "../../mtp" }
mtp-type-map = { path = "../../mtp/type-map" }
mtp-crypto = { path = "../../mtp/crypto" }
